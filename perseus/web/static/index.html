<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perseus</title>
<link rel="icon" href="/assets/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js" defer></script>
</head>
<body>
<div id="app" class="app pz-light">

  <!-- ===================== Left bar ===================== -->
  <aside class="side" aria-label="Perseus">
    <div class="side-logo">
      <button type="button" id="logo-top" class="logo-btn" aria-label="Perseus: go to the top of the chat" title="Top of the chat">
        <img src="/assets/logo-header.svg" alt="Perseus" class="logo">
      </button>
    </div>
    <div class="side-new">
      <button type="button" id="new-chat" class="btn btn-primary btn-wide">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
    </div>
    <nav class="side-nav" aria-label="Places">
      <button type="button" id="nav-tools" class="nav-item" data-view="tools">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span class="nav-label">Agent Tools</span>
        <span id="nav-tools-count" class="count-badge"></span>
      </button>
      <button type="button" class="nav-item nav-locked" disabled aria-disabled="true">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M6 9v3a3 3 0 0 0 3 3h6"/></svg>
        <span class="nav-text"><span class="nav-label">Autonomous Pipelines</span><span class="nav-caption">Coming soon</span></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
      <button type="button" id="nav-settings" class="nav-item" data-view="settings">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="nav-label">Settings</span>
      </button>
    </nav>

    <div class="side-tabs" role="tablist" aria-label="Sidebar">
      <button type="button" role="tab" id="tab-chats" class="side-tab" aria-selected="true" aria-controls="panel-chats">Chats</button>
      <button type="button" role="tab" id="tab-feed" class="side-tab" aria-selected="false" aria-controls="panel-feed">Tool feed</button>
    </div>
    <div class="side-panel">
      <div id="panel-chats" role="tabpanel" aria-labelledby="tab-chats">
        <ul id="chat-list" class="chat-list"></ul>
      </div>
      <div id="panel-feed" role="tabpanel" aria-labelledby="tab-feed" hidden>
        <div class="feed-meter">
          <span id="lookups-label">No lookups yet</span>
          <div id="lookups-bar" class="bar" role="progressbar" aria-label="Lookups used in the last answer" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><div id="lookups-fill" class="bar-fill"></div></div>
        </div>
        <div id="feed-list" class="feed-list"></div>
      </div>
    </div>
  </aside>

  <!-- ===================== Main ===================== -->
  <main class="main" id="main">
    <header class="topbar">
      <div class="top-left">
        <button type="button" id="back" class="btn btn-back" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          Back
        </button>
        <h1 id="header-title" class="title">Perseus</h1>
        <span id="ctx-pill" class="ctx-pill" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
          <span id="ctx-pct" class="ctx-pct">0%</span><span id="ctx-of" class="ctx-of"></span>
          <span class="ctx-track" aria-hidden="true"><span id="ctx-fill" class="ctx-fill"></span></span>
        </span>
      </div>
      <div class="top-status" role="status" aria-live="polite">
        <span id="status-dot" class="status-dot" aria-hidden="true"></span>
        <span id="status-long" class="status-long">Connecting…</span>
        <span id="status-model" class="status-model mono"></span>
      </div>
    </header>

    <!-- ===== Chat ===== -->
    <div id="chat-view" class="view-chat">
      <section id="scroller" class="scroller" aria-live="polite">
        <div id="messages" class="messages"></div>
      </section>
      <div class="composer-dock">
        <div class="composer-inner">
          <div id="top-row" class="top-row" hidden>
            <div id="attachments" class="attachments" aria-label="Attached files"></div>
            <button type="button" id="closeout" class="btn btn-closeout" hidden
                    title="Stop thinking and searching now; the model then writes its full final answer">Close out</button>
          </div>
          <div id="banner" class="banner" role="alert" hidden></div>
          <div class="msgbox-row">
            <button type="button" id="attach" class="side-btn side-btn-attach" aria-label="Attach text files" title="Attach text files">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l8.6-8.6a4 4 0 0 1 5.7 5.7l-8.6 8.6a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
            </button>
            <input type="file" id="file-input" multiple hidden>
            <div class="msgbox">
              <label for="composer" class="sr-only">Message Perseus</label>
              <textarea id="composer" rows="4" placeholder="Ask Perseus. It can search, read pages, run code and hand you files."></textarea>
            </div>
            <button type="button" id="send" class="side-btn side-btn-send" aria-label="Send message" title="Send message">
              <svg class="i-send" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
              <svg class="i-stop" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor"/></svg>
            </button>
          </div>
          <div class="qbar" role="toolbar" aria-label="Settings for this question">
            <button type="button" id="q-web" class="q-web" aria-pressed="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/></svg>
              <span id="q-web-label">Web on</span>
            </button>
            <div class="q-menu-wrap" id="q-persona-wrap">
              <button type="button" id="q-persona" class="q-chip" aria-haspopup="menu" aria-expanded="false" title="Switch system prompt">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                <span id="q-persona-label">Researcher</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div id="q-persona-menu" class="menu" role="menu" aria-label="System prompt" hidden></div>
            </div>
            <div class="q-menu-wrap" id="q-think-wrap">
              <button type="button" id="q-think" class="q-chip" aria-haspopup="menu" aria-expanded="false">
                <span id="q-think-label">Medium thinking</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div id="q-think-menu" class="menu" role="menu" aria-label="Thinking complexity" hidden></div>
            </div>
            <button type="button" id="q-gear" class="q-gear" aria-label="Chat settings" title="Chat settings">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Agent Tools ===== -->
    <section id="dev-view" class="view-dev" hidden>
      <div id="dev-body" class="dev"></div>
    </section>

    <!-- ===== Settings ===== -->
    <section id="settings-view" class="view-settings" hidden>
      <div id="settings-list" class="settings-list"></div>
      <div class="settings-dock">
        <div id="model-pills" class="model-pills" role="group" aria-label="Model"></div>
        <div class="server-bar" role="status">
          <span class="server-state"><span id="server-dot" class="status-dot" aria-hidden="true"></span><span id="server-label">—</span></span>
          <span id="pending-label" class="pending-label">No changes waiting for a restart.</span>
          <button type="button" id="discard" class="btn" hidden>Discard changes</button>
          <button type="button" id="apply" class="btn btn-primary btn-apply"><span id="apply-label">Restart model</span></button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Chat settings -->
<dialog id="chat-settings" class="dlg" aria-labelledby="cs-title">
  <div class="dlg-head">
    <div class="dlg-titles">
      <h2 id="cs-title">Chat settings</h2>
      <span class="hint">Used for every question until you change them.</span>
    </div>
    <button type="button" id="cs-close" class="btn btn-icon" aria-label="Close chat settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="cs-body" class="dlg-body"></div>
  <div class="dlg-foot"><button type="button" id="cs-done" class="btn btn-primary">Done</button></div>
</dialog>

<!-- Raw view (developer) -->
<dialog id="raw" class="dlg raw" aria-labelledby="raw-title">
  <div class="dlg-head">
    <h2 id="raw-title">Raw exchange</h2>
    <span id="raw-tokens" class="hint"></span>
    <button type="button" id="raw-close" class="btn btn-icon" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="raw-body">
    <p id="raw-note" class="hint" hidden></p>
    <h3>Prompt after the chat template</h3>
    <pre id="raw-prompt" class="code"></pre>
    <h3>Model output, per step</h3>
    <pre id="raw-output" class="code"></pre>
  </div>
</dialog>

<!-- Icons, cloned by app.js -->
<template id="icons">
  <svg data-i="globe" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/></svg>
  <svg data-i="x" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  <svg data-i="copy" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
  <svg data-i="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
  <svg data-i="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  <svg data-i="eye" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
  <svg data-i="file" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6"/></svg>
  <svg data-i="download" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
  <svg data-i="trash" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
  <svg data-i="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg data-i="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  <svg data-i="research" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  <svg data-i="code" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
  <svg data-i="plan" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 2 2 4-4"/><path d="M13 7h8"/><path d="m3 17 2 2 4-4"/><path d="M13 17h8"/></svg>
  <svg data-i="pen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  <svg data-i="alert" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
  <svg data-i="mark-in" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>
  <svg data-i="mark-out" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle class="mk-bg" cx="9" cy="9" r="9"/><path d="M5 9h7M9 5.5 12.5 9 9 12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg data-i="mark-flag" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle class="mk-bg" cx="9" cy="9" r="9"/><path d="M9 4.5v5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="9" cy="13" r="1.3" fill="currentColor"/></svg>
  <svg data-i="mark-bad" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="9" fill="currentColor"/><path class="mk-x" d="m6 6 6 6m0-6-6 6" stroke-width="2" stroke-linecap="round"/></svg>
  <svg data-i="mark-run" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="4 3"/></svg>
</template>
</body>
</html>
