# Blocks commits that contain secrets (HF tokens, API keys). Install once per clone:
#   uvx pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: no-perseus-config
        name: your config holds secrets and must never be committed
        entry: Config/*.toml and perseus.toml must not be committed (only Config/templates/)
        language: fail
        files: ^(perseus(\.resolved)?\.toml|Config/[^/]+\.toml|Config/\.(base|backup)/.*)$
