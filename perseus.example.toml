# Perseus configuration.
# Copy to perseus.toml (git-ignored, mode 600) and fill in [model].id and [secrets].hf_token.
# Both entry points read ./perseus.toml from the folder they run in; --config FILE points elsewhere.
# Any key set to "auto" is decided by preflight from the hardware and the model;
# a value you type here wins. CLI flags override one key for one run: --model.id org/name

[model]
id = "org/model-name"        # any Hugging Face repo with safetensors weights
revision = "main"            # pin a commit for repeatable boots
quantization = "auto"        # auto | fp8 | bf16 | awq | gptq
max_context = "auto"         # auto | a number of tokens
tensor_parallel = "auto"     # auto | 1 | 2 | 4 | 8
trust_remote_code = false    # true requires revision pinned to a commit
cpu_offload_gb = 0           # single GPU only: spill this many GB of weights to RAM (slower)
small_gpu = "auto"           # auto | true | false: small-GPU profile, decided by preflight
tool_parser = "auto"         # auto | a vLLM tool-call parser name (override if auto picks wrong)
reasoning_parser = "auto"    # auto | none | a vLLM reasoning parser name

[secrets]
hf_token = "hf_..."          # read by preflight only; perseus.py never loads it

[storage]
data_dir = "auto"            # auto = fastest local disk with room (weights, logs, SearXNG, run state);
                             # or an absolute path. Never inside the checkout.

[server]
bind = "127.0.0.1"
port = 8080
public = false               # true = bind 0.0.0.0 and require the access token

[search]
port = 8888                  # local only; never reachable by fetch_url
engines = ["duckduckgo", "wikipedia", "github", "arxiv", "stackoverflow", "mojeek"]

[backend]
max_restarts = 3             # crash restarts per process (vLLM, SearXNG), with backoff
fast_start = false           # true = skip CUDA graph capture: faster load, slower generation

[limits]
research_depth = "standard"  # quick | standard | deep (shown in the dashboard)
fetch_timeout_s = 15
max_response_kb = 2048
warn_download_minutes = 20

[code_runner]                # the run_code tool: builds and runs code in a remote, disposable sandbox
enabled = true               # on by default; stays off (and hidden from the model) until a key is set
backend = "e2b"              # e2b (more backends can plug in; see perseus/sandbox/backends/)
key_file = ""                # absolute path to a file holding your E2B API key (mode 600); read only by
                             # the sandbox broker, never by perseus.py. Or export E2B_API_KEY instead.
e2b_template = ""            # E2B template with the toolchains (setup/sandbox/); "" = E2B default
                             # (Python, Node.js and Bash only; C, C++, Rust, Go and Java need the template)
internet = false             # true lets sandboxed programs reach the internet (then the Internet
                             # Access switch also turns run_code off)
languages = []               # [] = every language the sandbox has; or a subset, e.g. ["python", "rust"]
build_timeout_s = 120        # compile step limit (5-180)
run_timeout_s = 30           # program run limit (1-120)
max_output_kb = 64           # stdout + stderr kept per run (head and tail)
